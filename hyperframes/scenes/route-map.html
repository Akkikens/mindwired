  for (let lat = Math.ceil(vy0 / 2) * 2 - 6; lat <= vy1 + 6; lat += 2) {
    const [, y] = P(vx0, lat); if (y < 0 || y > H) continue;
    el("line", { class: "grat", x1: -2000, y1: y, x2: W + 2000, y2: y }, grat);
    const t = pin(el("text", { class: "gratlbl", x: 10, y: y - 6 }, grat), 10, y - 6, 1); t.textContent = `${lat}°N`;
  }
  const land = $("land");
  for (const f of GEO.features) {
    const d = f.rings.map((r) => r.map(([lon, lat], i) => { const [x, y] = P(lon, lat); return `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`; }).join("") + "Z").join("");
    el("path", { class: "land", d }, land);
  }
  const labels = $("labels");
  for (const l of DATA.labels ?? []) {
    const [x, y] = P(l.lon, l.lat);
    const t = pin(el("text", { class: "lbl", x, y, "font-size": l.size ?? 22 }, labels), x, y, 200); t.textContent = l.text;
  }
  // scale bar (100 km at the view's mid latitude; outside the camera group, re-labeled under zoom)
  const midLat = (vy0 + vy1) / 2;
  const kmPerDegLon = 111.32 * Math.cos((midLat * Math.PI) / 180);
  const px100 = (100 / kmPerDegLon) * s;
  const scaleG = $("scale"); let scaleLbl, scaleLines;
  {
    const x = W - 54 - px100, y = H - 86;
    scaleLines = [el("line", { class: "scale", x1: x, y1: y, x2: x + px100, y2: y }, scaleG), el("line", { class: "scale", x1: x, y1: y - 7, x2: x, y2: y + 7 }, scaleG), el("line", { class: "scale", x1: x + px100, y1: y - 7, x2: x + px100, y2: y + 7 }, scaleG)];
    scaleLbl = el("text", { class: "scalelbl", x: x + px100 / 2, y: y - 12, "text-anchor": "middle" }, scaleG); scaleLbl.textContent = "100 km";
  }

  // ---- route geometry: great-circle legs, optional holding racetrack, final leg to the event ----
  const toXYZ = (lon, lat) => { const φ = lat * Math.PI / 180, λ = lon * Math.PI / 180; return [Math.cos(φ) * Math.cos(λ), Math.cos(φ) * Math.sin(λ), Math.sin(φ)]; };
  const fromXYZ = ([x, y, z]) => [Math.atan2(y, x) * 180 / Math.PI, Math.atan2(z, Math.hypot(x, y)) * 180 / Math.PI];
  const gc = (a, b, n = 48) => { const A = toXYZ(a.lon, a.lat), B = toXYZ(b.lon, b.lat); const pts = []; for (let i = 0; i <= n; i++) { const t = i / n; const v = A.map((c, k) => c * (1 - t) + B[k] * t); const m = Math.hypot(...v); pts.push(fromXYZ(v.map((c) => c / m))); } return pts; };
  const WP = DATA.waypoints;
  const segs = []; // [{pts:[[lon,lat]...], kind, time, text}]
  const wpText = (w) => `${w.name.toUpperCase()}${w.note ? " · " + w.note : ""}`;
  for (const [a, b] of DATA.legs ?? []) segs.push({ pts: gc(WP[a], WP[b]), kind: "leg", time: WP[a].time ?? "", text: wpText(WP[a]) });
  const H0 = DATA.holding;
  if (H0) {
    const kmLat = 110.57, kmLon = 111.32 * Math.cos(H0.lat * Math.PI / 180);
    const ang = (H0.headingDeg ?? 0) * Math.PI / 180, pts = [];
    for (let i = 0; i <= 96; i++) { // racetrack: two semicircles joined by straights
      const t = i / 96, L = H0.widthKm / 2 - H0.heightKm / 2, r = H0.heightKm / 2; let u, v;
      if (t < 0.25) { const a = t / 0.25 * Math.PI; u = L + Math.sin(a) * r; v = -Math.cos(a) * r; }
      else if (t < 0.5) { u = L - (t - 0.25) / 0.25 * 2 * L; v = r; }
      else if (t < 0.75) { const a = (t - 0.5) / 0.25 * Math.PI; u = -L - Math.sin(a) * r; v = Math.cos(a) * r; }
      else { u = -L + (t - 0.75) / 0.25 * 2 * L; v = -r; }
      const ex = u * Math.cos(ang) - v * Math.sin(ang), ey = u * Math.sin(ang) + v * Math.cos(ang);
      pts.push([H0.lon + ex / kmLon, H0.lat + ey / kmLat]);
    }
    const last = segs.length ? segs[segs.length - 1].pts.slice(-1)[0] : [H0.lon, H0.lat];
    let best = 0, bd = Infinity; pts.forEach((p, i) => { const d = Math.hypot(p[0] - last[0], p[1] - last[1]); if (d < bd) { bd = d; best = i; } });
    const rot = pts.slice(best).concat(pts.slice(1, best + 1));
    const prev = segs[segs.length - 1];
    segs.push({ pts: [last, rot[0]], kind: "leg", time: prev?.time ?? "", text: prev?.text ?? "" });
    for (let k = 0; k < (H0.loopsDrawn ?? 1); k++) segs.push({ pts: rot, kind: "hold", time: H0.time ?? "", text: H0.label });
    if (DATA.event) segs.push({ pts: gc({ lon: rot[rot.length - 1][0], lat: rot[rot.length - 1][1] }, DATA.event, 24), kind: "leg", time: H0.exitTime ?? "", text: H0.exitLabel ?? "" });
  } else if (DATA.event && segs.length) {
    const e = segs[segs.length - 1].pts.slice(-1)[0];
    segs.push({ pts: gc({ lon: e[0], lat: e[1] }, DATA.event, 24), kind: "leg", time: segs[segs.length - 1].time, text: segs[segs.length - 1].text });
  }
  const routes = $("routes");
  const dOf = (pts) => pts.map(([lon, lat], i) => { const [x, y] = P(lon, lat); return `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`; }).join("");
  // pre-sample every path ONCE at build time (positions + headings) so the timeline never measures the DOM
  const SAMPLES = 400;
  const paths = segs.map((sg) => {
    el("path", { class: "route-ghost", d: dOf(sg.pts) }, routes);
    const p = el("path", { class: sg.kind === "hold" ? "hold" : "route", d: dOf(sg.pts) }, routes);
    const len = p.getTotalLength();
    p.setAttribute("stroke-dasharray", `${len} ${len}`); p.setAttribute("stroke-dashoffset", len);
    const pts = []; for (let i = 0; i <= SAMPLES; i++) { const q = p.getPointAtLength((i / SAMPLES) * len); pts.push([q.x, q.y]); }
    return { p, len, pts };
  });
  const totalLen = paths.reduce((a, p) => a + p.len, 0);

  // ---- waypoints + labels ----
  const wps = $("wps");
  const anchorOff = { n: [0, -22], s: [0, 40], e: [20, 10], w: [-20, 10], ne: [16, -16], nw: [-16, -16], se: [16, 34], sw: [-16, 34] };
  const anchorTA = (a) => a.includes("w") ? "end" : (a === "n" || a === "s") ? "middle" : "start";
  const wpNodes = WP.map((w) => {
    const [x, y] = P(w.lon, w.lat);
    const outer = el("g", {}, wps);
    const g = pin(el("g", { transform: `translate(${x} ${y})` }, outer), x, y);
    el("circle", { class: `wp ${w.kind ?? "fix"}`, r: w.kind === "dest" ? 10 : 8 }, g);
    const a = w.anchor ?? "ne", [dx, dy] = anchorOff[a];
    const t1 = el("text", { class: "wplbl", x: dx, y: dy, "text-anchor": anchorTA(a) }, g); t1.textContent = w.name.toUpperCase();
    if (w.time || w.note) { const t2 = el("text", { class: "wpsub", x: dx, y: dy + 26, "text-anchor": anchorTA(a) }, g); t2.textContent = [w.time, w.note].filter(Boolean).join(" · "); }
    return outer;
  });
  let holdLbl = null;
  if (H0) { const [x, y] = P(H0.lon, H0.lat); holdLbl = el("g", {}, wps); const inner = pin(el("g", { transform: `translate(${x} ${y})` }, holdLbl), x, y); const t = el("text", { class: "holdlbl", x: H0.labelDx ?? 0, y: H0.labelDy ?? 60, "text-anchor": "middle" }, inner); t.textContent = H0.label; }
  const evg = $("event"); let evRing, evG;
  if (DATA.event) {
    const [x, y] = P(DATA.event.lon, DATA.event.lat);
    evG = el("g", {}, evg);
    const inner = pin(el("g", { transform: `translate(${x} ${y})` }, evG), x, y);
    evRing = el("circle", { class: "ev-ring", r: 14 }, inner);
    el("circle", { class: "ev-dot", r: 9 }, inner);
    const a = DATA.event.anchor ?? "nw", [dx, dy] = anchorOff[a];
    const t1 = el("text", { class: "evlbl", x: dx, y: dy, "text-anchor": anchorTA(a) }, inner); t1.textContent = DATA.event.label.toUpperCase();
    if (DATA.event.time) { const t2 = el("text", { class: "evsub", x: dx, y: dy + 28, "text-anchor": anchorTA(a) }, inner); t2.textContent = DATA.event.time; }
  }

  $("eyebrow").textContent = DATA.eyebrow ?? "";
  $("title").textContent = DATA.title ?? "";
  $("note").textContent = [DATA.pathNote, "BASEMAP: NATURAL EARTH 10m (PUBLIC DOMAIN) · MERCATOR"].filter(Boolean).join("  ·  ");

  // ---- camera (optional push): one driver u 0→1; map group scales about the zoom point while every
  //      pinned label/marker counter-scales so type keeps its screen size ----
  const cam = $("cam"); const Z = DATA.zoom; const camState = { u: 0 };
  const planeG = $("planeg"); let planeXY = [0, 0], planeAng = 0;
  const applyCam = () => {
    const u = camState.u, K = Z ? 1 + (Z.scale - 1) * u : 1;
    let tx = 0, ty = 0;
    if (Z) {
      const [px, py] = P(Z.lon, Z.lat); const sx = Z.screenX ?? W / 2, sy = Z.screenY ?? H / 2;
      const ex = px + (sx - px) * u, ey = py + (sy - py) * u; // where the zoom point sits on screen
      tx = ex - px * K; ty = ey - py * K;
      cam.setAttribute("transform", `translate(${tx} ${ty}) scale(${K})`);
      const inv = 1 / K;
      for (const [node, x, y, band] of fixed) {
        node.setAttribute("transform", `translate(${x} ${y}) scale(${inv})`);
        // edge guard: a pinned label fades out over `band` px as its anchor approaches any frame edge (0 = already outside)
        const sx = tx + x * K, sy = ty + y * K;
        const dEdge = Math.min(sx, W - sx, sy, H - sy);
        node.style.opacity = String(Math.max(0, Math.min(1, (dEdge - Math.min(40, band * 0.3)) / (band - Math.min(40, band * 0.3)))));
      }
      const km = 100 / K; const nice = km >= 60 ? 100 : km >= 25 ? 50 : km >= 12 ? 20 : 10;
      const px0 = px100 * nice / 100 * K; const x = W - 54 - px0, y = H - 86;
      scaleLines[0].setAttribute("x1", x); scaleLines[0].setAttribute("x2", x + px0); scaleLines[1].setAttribute("x1", x); scaleLines[1].setAttribute("x2", x); scaleLbl.setAttribute("x", x + px0 / 2); scaleLbl.textContent = `${nice} km`;
    }
    planeG.setAttribute("transform", `translate(${planeXY[0]} ${planeXY[1]}) scale(${1 / K}) rotate(${planeAng})`);
  };
  // pinned nodes already carry translate(x y); refactor them so the counter-scale composes correctly
  for (const [node, x, y] of fixed) { if (node.tagName === "text") { node.setAttribute("x", 0); node.setAttribute("y", 0); } node.setAttribute("transform", `translate(${x} ${y}) scale(1)`); }

  // ---- timeline ----
  const tl = gsap.timeline({ paused: true });
  const T_IN = 1.2, T_DRAW_END = Math.max(T_IN + 3, DUR - 3.2);
  tl.fromTo(land.querySelectorAll("path"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out", stagger: { each: 0.02, from: "random", grid: "auto" } }, 0);
  tl.fromTo([grat, labels, scaleG], { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0.3);
  tl.fromTo($("chrome"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.4);
  tl.fromTo([$("readout"), $("note")], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
  tl.fromTo(wpNodes, { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.1 }, 0.8);
  if (holdLbl) tl.fromTo(holdLbl, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
  if (evG) tl.set(evG, { opacity: 0 }, 0);

  // ONE driver for the route: draw, plane position/heading and the readout are all projections of p.
  // Time is budgeted per segment (not per km): a holding loop and the final descent get fixed beats,
  // the cruise legs share the rest in proportion to their length.
  const budget = segs.map((sg, i) => sg.kind === "hold" ? (H0.loopSeconds ?? 3.2) : (i === segs.length - 1 && DATA.event) ? (DATA.event.legSeconds ?? 2.2) : (sg.pts.length <= 2 ? 0.25 : -1));
  const fixedT = budget.reduce((a, b) => a + (b > 0 ? b : 0), 0);
  const freeLen = segs.reduce((a, sg, i) => a + (budget[i] < 0 ? paths[i].len : 0), 0);
  const DRAW = T_DRAW_END - T_IN;
  const segDur = budget.map((b, i) => b > 0 ? b : ((DRAW - fixedT) * paths[i].len) / freeLen);
  const segStart = []; { let a = 0; for (const d of segDur) { segStart.push(a); a += d; } }
  const drv = { p: 0 };
  const roTime = $("ro-time"), roText = $("ro-text");
  let lastRO = "";
  const setRO = (time, text) => { const k = time + "|" + text; if (k === lastRO) return; lastRO = k; roTime.textContent = time; roText.textContent = text; };
  const segAt = (tt) => { let i = 0; while (i < segs.length - 1 && tt >= segStart[i + 1]) i++; return i; };
  const roFor = (tt) => {
    const i = segAt(tt); const local = (tt - segStart[i]) / segDur[i];
    if (i === segs.length - 1 && DATA.event && local >= 0.985) return [DATA.event.time ?? "", DATA.event.label.toUpperCase()];
    return [segs[i].time, segs[i].text];
  };
  setRO(...roFor(0));
  planeXY = paths[0].pts[0]; applyCam();
  tl.to(drv, { p: DRAW, duration: DRAW, ease: "none", onUpdate: () => {
    const tt = drv.p; const cur = segAt(tt);
    for (let i = 0; i < paths.length; i++) {
      const { p: path, len, pts } = paths[i];
      const local = i < cur ? 1 : i > cur ? 0 : Math.max(0, Math.min(1, (tt - segStart[i]) / segDur[i]));
      path.setAttribute("stroke-dashoffset", len * (1 - local));
      if (i === cur) {
        const f = local * SAMPLES, i0 = Math.min(SAMPLES - 1, Math.floor(f)), t = f - i0;
        const a = pts[i0], b = pts[i0 + 1];
        planeXY = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        planeAng = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + 90;
      }
    }
    setRO(...roFor(tt));
    applyCam();
  } }, T_IN);
  tl.fromTo($("plane"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, T_IN);
  if (Z) tl.to(camState, { u: 1, duration: Z.duration ?? 2, ease: "power2.inOut", onUpdate: applyCam }, Z.at ?? 4);
  if (evG) {
    tl.to($("plane"), { opacity: 0, duration: 0.3 }, T_DRAW_END - 0.1);
    tl.fromTo(evG, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T_DRAW_END - 0.2);
    const cycles = Math.max(0, Math.floor((DUR - T_DRAW_END - 0.5) / 1.2) - 1);
    tl.fromTo(evRing, { attr: { r: 14 }, opacity: 1 }, { attr: { r: 46 }, opacity: 0, duration: 1.2, ease: "power2.out", repeat: cycles }, T_DRAW_END + 0.2);
  }
  tl.to([$("chrome"), $("readout"), $("note"), $("svg")], { opacity: 0, duration: 0.45, ease: "power2.in" }, DUR - 0.45);
  window.__timelines[ID] = tl;
})();
</script>
