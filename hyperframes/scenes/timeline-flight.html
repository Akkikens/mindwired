<style>

<script>
(() => {
  const DATA = {"scene":"timeline","duration":16.7,"eyebrow":"12 Nov 2001 · JFK to Belle Harbor","title":"Two minutes and fifty-four seconds","tz":"EST","start":"09:13","end":"09:17","hourTicks":["09:13","09:14","09:15","09:16","09:17"],"note":"TIMES EST FROM NTSB AAR-04/04 AND THE COCKPIT VOICE RECORDER TRANSCRIPT (NTSB DOCKET) · RADIO AND COCKPIT LINES ARE TRANSCRIPT TEXT, NOT AUDIO","events":[{"t":"09:13:21","tag":"Control handed over","text":"The captain: \"you have the airplane.\" The first officer will fly this leg."},{"t":"09:13:27","tag":"Cleared for takeoff","text":"Kennedy tower clears AA587 heavy for takeoff on runway 31L."},{"t":"09:13:35","tag":"First officer","text":"\"you happy with that distance?\""},{"t":"09:13:51","tag":"Takeoff roll","text":"AA587 begins its takeoff roll behind the Japan Airlines B747-400 (JAL47)."},{"t":"09:14:29","tag":"Liftoff","text":"Liftoff, about 1 min 40 s behind JAL47. The rule: two minutes OR four nautical miles. Actual spacing: at least 4.3 nm and 3,800 ft."},{"t":"09:15:00","tag":"Departure","text":"\"thirteen hundred feet, we're climbing to five thousand.\" New York departure clears the climb to 13,000 ft."},{"t":"09:15:36","tag":"First wake encounter","text":"Climbing through about 1,700 ft. Seven control-wheel movements; the rudder pedals barely move."},{"t":"09:15:41","tag":"Last transmission","text":"\"we'll turn direct WAVEY.\" The last words air traffic control receives from AA587."},{"t":"09:15:44","tag":"Captain","text":"\"little wake turbulence, huh?\""},{"t":"09:15:51","tag":"Second wake encounter","text":"About 2,430 ft above the ground. Control wheel to 64° right at 09:15:51.5; right rudder pedal 1.7 in at 09:15:51.9.","color":"danger"},{"t":"09:15:54","tag":"First officer","text":"\"max power.\" Spoken in a strained voice, the transcript notes. Airspeed 240 kt. The pedals go 1.7R, 1.7L, 1.7R, 2.0R, 2.4L, 1.3R."},{"t":"09:15:58","tag":"Fin separates","text":"The right rear main attachment fitting fractures at 09:15:58.4 — rudder 10–11° right, sideslip 11–12°. A loud bang on the recorder at 09:15:58.5. About 251 kt.","color":"danger"},{"t":"09:16:01","tag":"Flight data stops","text":"Last synchronized flight-data point, 13.6 s before impact. Sideslip has reached 31°."},{"t":"09:16:07","tag":"First officer","text":"\"what the hell are we into. we're stuck in it.\""},{"t":"09:16:12","tag":"Captain","text":"\"get out of it, get out of it.\""},{"t":"09:16:14","tag":"End of recording","text":"The cockpit voice recorder stops when electrical power is lost, 30 min 39 s after it began."},{"t":"09:16:15","tag":"Impact","text":"Newport Avenue and Beach 131st Street, Belle Harbor. 260 aboard and five on the ground are killed: 265.","color":"danger"}],"claims":["c12","c13","c14","c15","c17","c18","c19","c20","c22","c23","c24","c25","c28","c29","c31","c32","c33","c34","c35","c39","c40","c41","c42","c43","c44","c45","c46","c47","c48","c49","c50","c51","c54","c61","c63","c64"],"_facts":"CLAIMS-american587.md ANCHORS, all CONFIRMED (AAR-04/04 §1.1, App. B; CVR exhibit docket item 180; FDR item 164): c12 0913:21 'you have the airplane'; c13 0913:27.6 cleared for takeoff; c14 0913:35.3 'you happy with that distance?'; c15 0913:51 roll; c17 0914:29 liftoff; c18 1 min 40 s; c19 rule 2 min OR 4 nm; c20 ≥4.3 nm / 3,800 ft; c22/c23 0915:00 call and 13,000-ft clearance; c24/c25 0915:36 first encounter ~1,700 ft msl; c28 0915:41 last transmission; c29 0915:44.7; c31/c32 0915:51 second encounter ~2,430 ft agl; c33 wheel 64° R at 0915:51.5; c34 pedal 1.7 in R at 0915:51.9; c35 pedal sequence; c40 0915:54.2 'max power' / 240 kt; c39/c41 0915:58.4 fracture, rudder 10–11° R, sideslip 11–12° R; c42 0915:58.5 bang; c43 ~251 kt; c44 0916:01.23 last FDR data; c45 13.6 s; c46 31° sideslip; c47 0916:07.5; c48 0916:12.8; c49 0916:14.8 end of recording; c51 30 min 39 s; c50 ~0916:15 impact; c54 Newport Ave & Beach 131st; c61/c63/c64 260 + 5 = 265. Second-level precision is rounded down to the whole second for the rail (the AAR gives tenths); quotes are the transcript strings from CLAIMS §B.3 ('WAVEY' capitalised as in the transcript). The 0914:42.6 'Bridge Climb' handoff is omitted because it has no ANCHORS row."};
  const ID = "timeline-flight";
  const DUR = 16.7;
  const $ = (s) => document.getElementById(`${ID}-${s}`);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const sec = (t) => { const p = t.split(":").map(Number); return p[0] * 3600 + p[1] * 60 + (p[2] ?? 0); };
  const RW = 1728;
  const t0 = sec(DATA.start), t1 = sec(DATA.end);
  const X = (t) => ((t - t0) / (t1 - t0)) * RW;
  const EV = DATA.events.slice().sort((a, b) => sec(a.t) - sec(b.t));

  $("eyebrow").textContent = DATA.eyebrow ?? "";
  $("title").textContent = DATA.title ?? "";
  $("clock-tz").textContent = DATA.tz ?? "";
  $("note").textContent = DATA.note ?? "";

  for (const h of DATA.hourTicks ?? []) { const x = X(sec(h)); el("line", { class: "htick", x1: x, x2: x, y1: 24, y2: 46 }, $("hours")); const t = el("text", { class: "hlbl", x, y: 68 }, $("hours")); t.textContent = h; }
  const dots = EV.map((e) => el("circle", { class: `ev ${e.color ?? ""}`, cx: X(sec(e.t)), cy: 35, r: 7 }, $("evs")));
  const rows = EV.map((e) => {
    const r = document.createElement("div"); r.className = `${ID}-row ${e.color ?? ""}`;
    const t = document.createElement("div"); t.className = "t"; t.textContent = e.t;
    const x = document.createElement("div"); x.className = "x"; x.textContent = e.text;
    r.appendChild(t); r.appendChild(x); $("log").appendChild(r); return r;
  });

  // schedule: each event gets an equal slot of the available time; the playhead travels for 30% of
  // the slot and holds for 70%, so clustered events (minutes apart) still get their own beat.
  const T0 = 1.0, T1 = DUR - 0.9;
  const slot = (T1 - T0) / EV.length;
  const keys = []; // [{tl time, rail time}] piecewise-linear playhead
  keys.push([T0, t0]);
  EV.forEach((e, i) => { const arrive = T0 + slot * i + slot * 0.3; keys.push([arrive, sec(e.t)]); keys.push([T0 + slot * (i + 1), sec(e.t)]); });
  const railTimeAt = (tt) => { if (tt <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { if (tt <= keys[i][0]) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; return b === a ? vb : va + ((vb - va) * (tt - a)) / (b - a); } } return keys[keys.length - 1][1]; };

  const clock = $("clock-t"), tag = $("tag"), text = $("text"), done = $("done"), ph = $("playhead");
  const fmtClock = (s) => `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}`;
  let lastActive = -2, lastClock = "";
  const drv = { t: 0 };
  const apply = () => {
    const rt = railTimeAt(drv.t); const x = X(rt);
    ph.setAttribute("transform", `translate(${x} 0)`); done.setAttribute("x2", x);
    // active = last event whose time <= rail time (with a 1s tolerance for exact arrivals)
    let a = -1; for (let i = 0; i < EV.length; i++) if (sec(EV[i].t) <= rt + 0.5) a = i;
    if (a !== lastActive) {
      rows.forEach((r, i) => r.classList.toggle("on", i === a)); dots.forEach((d, i) => d.classList.toggle("on", i <= a));
      if (a >= 0) { clock.textContent = EV[a].t; tag.textContent = EV[a].tag ?? ""; text.textContent = EV[a].text; } else { clock.textContent = fmtClock(rt); tag.textContent = ""; text.textContent = ""; }
      lastActive = a; lastClock = clock.textContent;
    } else if (a >= 0 && rt > sec(EV[a].t) + 59) {
      // travelling between events: the clock runs with the playhead (minute resolution), the card keeps the last event
      const c = fmtClock(rt); if (c !== lastClock) { clock.textContent = c; lastClock = c; }
    }
  };
  apply();

  const tl = gsap.timeline({ paused: true });
  tl.fromTo($("chrome"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0);
  tl.fromTo($("rail"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);
  tl.fromTo($("note"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
  // rows exist from the start as faint ruled lines (the log's "paper"), each brightening on arrival
  rows.forEach((r, i) => { const arrive = T0 + slot * i + slot * 0.3; tl.fromTo(r, { opacity: 0.18, x: 0 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, arrive); });
  tl.fromTo($("active"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, T0);
  // the log scrolls so the active row stays inside the window (row heights are authored constants that mirror the CSS:
  // 23px/1.25 body on a 652px column ≈ 56 chars per line; 9px padding top/bottom + 1px rule)
  const rowH = EV.map((e) => 19 + Math.max(1, Math.ceil(e.text.length / 56)) * 29);
  const rowTop = []; { let a = 0; for (const h of rowH) { rowTop.push(a); a += h; } }
  const WIN = 600, KEEP = 330; // keep the active row's top above this line
  let yPrev = 0;
  EV.forEach((e, i) => { const arrive = T0 + slot * i + slot * 0.3; const y = -Math.max(0, rowTop[i] - KEEP); if (y !== yPrev) { tl.fromTo($("log"), { y: yPrev }, { y, duration: 0.6, ease: "power2.inOut", immediateRender: false }, arrive - 0.2); yPrev = y; } });
  // the active card re-enters on every event change: one tween per arrival (seek-safe, explicit from-state)
  EV.forEach((e, i) => { const arrive = T0 + slot * i + slot * 0.3; tl.fromTo([tag, text], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, arrive); tl.fromTo(clock, { scale: 0.96, transformOrigin: "left center" }, { scale: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, arrive); });
  tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: apply }, 0);
  tl.to([$("chrome"), $("logwin"), $("active"), $("rail"), $("note")], { opacity: 0, duration: 0.45, ease: "power2.in" }, DUR - 0.45);
  window.__timelines[ID] = tl;
})();
</script>
