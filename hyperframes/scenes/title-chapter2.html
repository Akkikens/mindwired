<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>helios522 · title-chapter2</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070C; }
/* mindwired scene-kit theme — derived from src/mindwired-doc/DocWide.tsx (THEMES, dsp(),
   StatChip, CaptionBar, ChapterCard) and docs/planning/CRAFT-AUDIT.md's four-voice type system.
   Fonts are the SAME OFL files the Remotion engine ships in public/fonts (copied to ../assets/fonts),
   declared with @font-face so HyperFrames inlines them at build time — no runtime font race.

   The build script (scripts/build.mjs) inlines this file into every generated scene and swaps
   the accent for the channel given on the command line (--channel mindwired|blackbox|criminalrecord). */

@font-face { font-family: 'Archivo Expanded'; src: url('../assets/fonts/ArchivoExpanded-ExtraBold.ttf') format('truetype'); font-weight: 700 900; font-style: normal; font-display: block; }
@font-face { font-family: 'Archivo Expanded'; src: url('../assets/fonts/ArchivoExpanded-SemiBold.ttf') format('truetype'); font-weight: 100 699; font-style: normal; font-display: block; }
@font-face { font-family: 'Spectral'; src: url('../assets/fonts/Spectral-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: block; }
@font-face { font-family: 'Spectral'; src: url('../assets/fonts/Spectral-MediumItalic.ttf') format('truetype'); font-weight: 500; font-style: italic; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('../assets/fonts/IBMPlexMono-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('../assets/fonts/IBMPlexMono-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: block; }
@font-face { font-family: 'Inter'; src: url('../assets/fonts/Inter.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: block; }

:root, #root {
  /* palette — DocWide BASE #05070C, mindwired accent #4DD8FF (blackbox #FF9500, criminalrecord #7FB4FF) */
  --base: #05070C;
  --base-2: #0B1019;
  --panel: rgba(4, 6, 10, 0.78);
  --ink: #FFFFFF;
  --ink-2: rgba(255, 255, 255, 0.72);
  --ink-3: rgba(255, 255, 255, 0.50);
  --rule: rgba(255, 255, 255, 0.14);
  --rule-2: rgba(255, 255, 255, 0.26);
  --accent: #4DD8FF;
  --accent-dim: rgba(77, 216, 255, 0.35);
  --accent-tint: rgba(77, 216, 255, 0.12);
  --danger: #FF4D4D;
  --ok: #7CFC9B;

  /* four-voice type system (CRAFT-AUDIT Finding 2) */
  --display: 'Archivo Expanded', 'Archivo', 'Space Grotesk', sans-serif; /* hero titles, chapter cards, stat numerals */
  --serif: 'Spectral', Georgia, serif;                                     /* quotes, testimony, editorial lines */
  --mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;                    /* evidence chrome, eyebrows, clocks */
  --body: 'Inter', sans-serif;                                             /* captions, labels */

  /* DocWide overlay safe zones (the host comp draws these on top of a video scene):
     brand lockup top-right (42px/54px), stat chip top-left (118px/96px), caption bar bottom 84px.
     Scenes keep the bottom 150px quiet and the top-right corner free. */
  --safe-x: 96px;
  --safe-top: 96px;
  --safe-bottom: 150px;
}

#root { background: var(--base); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }

/* evidence eyebrow: mono, tracked, hairlines either side (DocWide ChapterCard) */
.eyebrow { font-family: var(--mono); font-weight: 600; font-size: 24px; letter-spacing: 8px; color: var(--accent); text-transform: uppercase; display: flex; align-items: center; gap: 22px; }
.eyebrow::before, .eyebrow::after { content: ""; display: block; width: 72px; height: 1px; background: var(--accent-dim); }
.eyebrow.left::before { display: none; }

/* hairline-diamond rule */
.diamond-rule { display: flex; align-items: center; gap: 14px; }
.diamond-rule i { display: block; width: 150px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent)); }
.diamond-rule i:last-child { background: linear-gradient(270deg, transparent, var(--accent)); }
.diamond-rule b { display: block; width: 9px; height: 9px; background: var(--accent); transform: rotate(45deg); }

/* stat chip (DocWide StatChip) */
.stat-chip { font-family: var(--display); font-weight: 800; font-size: 50px; letter-spacing: 0.5px; font-variant-numeric: tabular-nums lining-nums; color: var(--ink); background: var(--panel); padding: 14px 30px 15px; border-left: 6px solid var(--accent); border-radius: 6px; display: inline-block; }

/* source plate (DocWide ExhibitScene lower-third) */
.source-plate { font-family: var(--body); font-weight: 600; font-size: 30px; line-height: 1.3; color: var(--ink); background: rgba(3,4,7,0.8); padding: 10px 22px; border-left: 5px solid var(--accent); border-radius: 8px; display: inline-block; max-width: 1100px; }
.source-plate .tag { display: block; font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: 4px; color: var(--accent); margin-bottom: 4px; }

</style>
</head>
<body>
<!-- scene: title-card — kinetic chapter card (DocWide ChapterCard, animated word by word)
     data: { eyebrow, title, sub?, image?, imageCredit?, accentLastWord? (default true), duration } -->
<style>
  #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  #title-chapter2-bg { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: brightness(0.32) saturate(0.6) blur(2px); will-change: transform; }
  #title-chapter2-shade { position: absolute; inset: 0; background: radial-gradient(ellipse 62% 70% at 50% 52%, rgba(5,7,12,0.1) 0%, rgba(5,7,12,0.78) 68%, rgba(5,7,12,0.96) 100%); }
  #title-chapter2-ring { position: absolute; left: 50%; top: 52%; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; border: 1px solid var(--accent-dim); will-change: transform, opacity; }
  #title-chapter2-stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 0 180px var(--safe-bottom); }
  #title-chapter2-title { font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1.06; letter-spacing: -0.5px; text-align: center; max-width: 1560px; color: var(--ink); text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
  #title-chapter2-title .w { display: inline-block; margin: 0 0.14em; will-change: transform, opacity; }
  #title-chapter2-title .w.accent { color: var(--accent); }
  #title-chapter2-sub { font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: 3px; color: var(--ink-2); text-align: center; }
  #title-chapter2-credit { position: absolute; right: 54px; bottom: 44px; font-family: var(--mono); font-size: 16px; letter-spacing: 1px; color: var(--ink-3); }
  .diamond-rule i, .diamond-rule b { will-change: transform; }
</style>

<div id="root" data-composition-id="title-chapter2" data-start="0" data-width="1920" data-height="1080" data-duration="6">
  <div id="title-chapter2-bg"></div>
  <div id="title-chapter2-shade"></div>
  <div id="title-chapter2-ring"></div>
  <div id="title-chapter2-stack">
    <div class="eyebrow" id="title-chapter2-eyebrow"><span id="title-chapter2-eyebrow-text"></span></div>
    <h1 id="title-chapter2-title"></h1>
    <div class="diamond-rule" id="title-chapter2-rule"><i></i><b></b><i></i></div>
    <div id="title-chapter2-sub"></div>
  </div>
  <div id="title-chapter2-credit"></div>
</div>

<script>
(() => {
  const DATA = {"scene":"title-card","duration":6,"eyebrow":"Chapter 2","title":"Two Warnings. One Sound.","sub":"09:12:38 EEST · CABIN ALTITUDE HORN · 12,040 FT","image":"../assets/samples/helios_5B-DBY_cdg_2005.jpeg","imageCredit":"5B-DBY, PARIS CDG, MAY 2005 · CC BY 2.0 · WIKIMEDIA COMMONS","accentLastWord":true,"_facts":"CLAIMS-helios522.md: 09:12:38 cabin altitude warning horn at 12,040 ft; tonally identical to the takeoff-configuration horn (report p.133)."};
  const ID = "title-chapter2";
  const $ = (s) => document.getElementById(`${ID}-${s}`);
  const DUR = 6;

  if (DATA.image) $("bg").style.backgroundImage = `url('${DATA.image}')`;
  $("eyebrow-text").textContent = DATA.eyebrow ?? "";
  $("sub").textContent = DATA.sub ?? "";
  $("credit").textContent = DATA.imageCredit ?? "";

  const words = String(DATA.title ?? "").split(/\s+/).filter(Boolean);
  const accentLast = DATA.accentLastWord !== false;
  const title = $("title");
  words.forEach((w, i) => {
    const span = document.createElement("span");
    span.className = "w" + (accentLast && i === words.length - 1 ? " accent" : "");
    span.textContent = w;
    title.appendChild(span);
  });

  const tl = gsap.timeline({ paused: true });
  // slow push on the plate for the whole hold (DocWide ChapterCard: smoothstep scale 1 → 1.06)
  tl.fromTo($("bg"), { scale: 1.0 }, { scale: 1.07, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo($("bg"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
  tl.fromTo($("ring"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.6, ease: "power3.out" }, 0.1);
  tl.to($("ring"), { scale: 1.08, duration: DUR - 1.7, ease: "sine.inOut" }, 1.7);
  tl.fromTo($("eyebrow"), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.25);
  // words rise one per beat (DocWide KineticScene per-word spring), stagger capped so the arrival reads as one line
  const stagger = Math.min(0.14, 0.6 / Math.max(1, words.length));
  tl.fromTo(title.querySelectorAll(".w"), { y: 46, opacity: 0, rotateX: -20 },
    { y: 0, opacity: 1, rotateX: 0, duration: 0.7, ease: "back.out(1.4)", stagger }, 0.55);
  const rule = $("rule");
  tl.fromTo(rule.querySelector("b"), { scale: 0, rotate: 45 }, { scale: 1, rotate: 45, duration: 0.5, ease: "back.out(2)" }, 1.05 + stagger * words.length);
  tl.fromTo(rule.querySelectorAll("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out", stagger: 0 }, 1.15 + stagger * words.length);
  tl.fromTo($("sub"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.35 + stagger * words.length);
  tl.fromTo($("credit"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.6);
  // settle: a faint breathing on the title so the hold never freezes
  tl.fromTo(title, { scale: 1 }, { scale: 1.015, duration: DUR - 2.2, ease: "sine.inOut" }, 2.2);
  // fade to base for the cut
  tl.to([$("stack"), $("bg"), $("ring"), $("credit")], { opacity: 0, duration: 0.45, ease: "power2.in" }, DUR - 0.45);
  window.__timelines[ID] = tl;
})();
</script>

</body>
