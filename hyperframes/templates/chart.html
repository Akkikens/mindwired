<!-- scene: chart — animated line (time series with a read head) or bar chart, plus count-up stat tiles.
     data: { kind:"line"|"bar", eyebrow, title, unit?, note?, duration,
             line: { series:[{t:"HH:MM[:SS]", v:number, label?}], markers?:[{t,v,label,color?}], yTicks?:[n...], xTicks?:["HH:MM"...] }
             bar:  { categories:[{label, v, color?}], max? }
             stats?:[{value:number|string, label, suffix?, prefix?}] } -->
<style>
  #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  #{{ID}}-glow { position: absolute; left: 30%; top: 20%; width: 1100px; height: 700px; border-radius: 50%; background: radial-gradient(circle, var(--accent-tint) 0%, transparent 65%); filter: blur(40px); will-change: transform, opacity; }
  #{{ID}}-chrome { position: absolute; left: var(--safe-x); top: 64px; display: flex; flex-direction: column; gap: 10px; }
  #{{ID}}-title { font-family: var(--display); font-weight: 800; font-size: 44px; color: var(--ink); }
  #{{ID}}-plot { position: absolute; left: 96px; top: 230px; width: 1240px; height: 660px; }
  #{{ID}}-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #{{ID}}-svg .grid { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
  #{{ID}}-svg .axis { stroke: rgba(255,255,255,0.35); stroke-width: 2; }
  #{{ID}}-svg .tick { font-family: var(--mono); font-size: 19px; fill: var(--ink-3); letter-spacing: 1px; }
  #{{ID}}-svg .series { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 12px var(--accent-dim)); }
  #{{ID}}-svg .area { fill: url(#{{ID}}-fade); }
  #{{ID}}-svg .pt { fill: #05070C; stroke: var(--accent); stroke-width: 3; }
  #{{ID}}-svg .ptlbl { font-family: var(--mono); font-weight: 600; font-size: 19px; fill: var(--ink-2); letter-spacing: 1px; paint-order: stroke; stroke: #05070C; stroke-width: 6px; }
  #{{ID}}-svg .mk { fill: var(--danger); }
  #{{ID}}-svg .mklbl { font-family: var(--mono); font-weight: 600; font-size: 19px; fill: var(--danger); letter-spacing: 1px; paint-order: stroke; stroke: #05070C; stroke-width: 6px; }
  #{{ID}}-svg .head { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 6; }
  #{{ID}}-svg .headdot { fill: var(--ink); }
  /* fixed readout above the plot's right edge: it never collides with point labels inside the plot */
  #{{ID}}-tip { position: absolute; right: -40px; top: -84px; min-width: 240px; background: var(--panel); border-left: 4px solid var(--accent); padding: 8px 16px; border-radius: 4px; }
  #{{ID}}-tip .t { font-family: var(--mono); font-weight: 600; font-size: 20px; color: var(--accent); letter-spacing: 2px; }
  #{{ID}}-tip .v { font-family: var(--display); font-weight: 800; font-size: 38px; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
  #{{ID}}-tip .v small { font-family: var(--mono); font-weight: 500; font-size: 20px; color: var(--ink-2); margin-left: 8px; }
  #{{ID}}-bars { position: absolute; left: 0; right: 0; top: 40px; bottom: 60px; display: flex; align-items: flex-end; justify-content: space-evenly; gap: 40px; border-bottom: 2px solid rgba(255,255,255,0.35); }
  .{{ID}}-bar { display: flex; flex-direction: column; align-items: center; width: 220px; height: 100%; justify-content: flex-end; }
  .{{ID}}-bar .v { font-family: var(--display); font-weight: 800; font-size: 54px; color: var(--ink); font-variant-numeric: tabular-nums; margin-bottom: 14px; }
  .{{ID}}-bar .b { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; transform-origin: bottom; will-change: transform; }
  .{{ID}}-bar .l { position: absolute; bottom: -46px; font-family: var(--mono); font-weight: 600; font-size: 21px; letter-spacing: 2px; color: var(--ink-2); text-transform: uppercase; white-space: nowrap; }
  .{{ID}}-bar { position: relative; }
  #{{ID}}-stats { position: absolute; left: 1420px; top: 250px; width: 404px; display: flex; flex-direction: column; gap: 34px; }
  .{{ID}}-stat { border-top: 1px solid var(--rule-2); padding-top: 16px; }
  .{{ID}}-stat .v { font-family: var(--display); font-weight: 800; font-size: 76px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .{{ID}}-stat .v em { font-style: normal; color: var(--accent); }
  .{{ID}}-stat .l { font-family: var(--mono); font-weight: 600; font-size: 21px; letter-spacing: 3px; color: var(--ink-2); text-transform: uppercase; margin-top: 10px; }
  #{{ID}}-note { position: absolute; right: 54px; bottom: 44px; font-family: var(--mono); font-size: 16px; letter-spacing: 1px; color: var(--ink-3); text-align: right; max-width: 1100px; }
</style>

<div id="root" data-composition-id="{{ID}}" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
  <div id="{{ID}}-glow"></div>
  <div id="{{ID}}-chrome">
    <div class="eyebrow left" id="{{ID}}-eyebrow"></div>
    <div id="{{ID}}-title"></div>
  </div>
  <div id="{{ID}}-plot">
    <svg id="{{ID}}-svg" viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="{{ID}}-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <g id="{{ID}}-grid"></g>
      <g id="{{ID}}-axes"></g>
      <path id="{{ID}}-area" class="area"/>
      <path id="{{ID}}-series" class="series"/>
      <g id="{{ID}}-pts"></g>
      <g id="{{ID}}-mks"></g>
      <line id="{{ID}}-head" class="head" y1="0" y2="600"/>
      <circle id="{{ID}}-headdot" class="headdot" r="9"/>
    </svg>
    <div id="{{ID}}-bars"></div>
    <div id="{{ID}}-tip"><div class="t" id="{{ID}}-tip-t"></div><div class="v"><span id="{{ID}}-tip-v"></span><small id="{{ID}}-tip-u"></small></div></div>
  </div>
  <div id="{{ID}}-stats"></div>
  <div id="{{ID}}-note"></div>
</div>

<script>
(() => {
  const DATA = {{DATA}};
  const ID = "{{ID}}";
  const DUR = {{DURATION}};
  const $ = (s) => document.getElementById(`${ID}-${s}`);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  $("eyebrow").textContent = DATA.eyebrow ?? "";
  $("title").textContent = DATA.title ?? "";
  $("note").textContent = DATA.note ?? "";

  const tl = gsap.timeline({ paused: true });
  tl.fromTo($("glow"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0);
  tl.to($("glow"), { scale: 1.12, duration: DUR - 1.4, ease: "sine.inOut" }, 1.4);
  tl.fromTo($("chrome"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.2);
  tl.fromTo($("note"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);

  // ---- stat tiles: count-ups with tabular figures (one driver each, text written from the driver) ----
  const stats = DATA.stats ?? [];
  const statsBox = $("stats");
  const statNodes = stats.map((st) => {
    const d = document.createElement("div"); d.className = `${ID}-stat`;
    const v = document.createElement("div"); v.className = "v";
    const em = document.createElement("em"); em.textContent = st.prefix ?? ""; v.appendChild(em);
    const num = document.createElement("span"); v.appendChild(num);
    const suf = document.createElement("em"); suf.textContent = st.suffix ?? ""; v.appendChild(suf);
    const l = document.createElement("div"); l.className = "l"; l.textContent = st.label;
    d.appendChild(v); d.appendChild(l); statsBox.appendChild(d);
    return { d, num, st };
  });
  statNodes.forEach(({ d, num, st }, i) => {
    const at = 1.0 + i * 0.5;
    tl.fromTo(d, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
    // No roll-up counters (memory no-count-up-number-animation): the figure
    // lands at its real value with the tile's own fade/rise, never ticks up.
    num.textContent = typeof st.value === "number" ? fmt(st.value) : st.value;
  });

  const W = 1240, H = 660, PADL = 110, PADR = 30, PADT = 40, PADB = 60;
  const PW = W - PADL - PADR, PH = H - PADT - PADB;

  if (DATA.kind === "bar") {
    $("svg").style.display = "none"; $("tip").style.display = "none";
    const cats = DATA.bar.categories; const max = DATA.bar.max ?? Math.max(...cats.map((c) => c.v));
    const box = $("bars");
    const nodes = cats.map((c) => {
      const w = document.createElement("div"); w.className = `${ID}-bar`;
      const v = document.createElement("div"); v.className = "v"; v.textContent = "0";
      const b = document.createElement("span"); b.className = "b"; b.style.height = `${Math.max(2, (c.v / max) * (PH - 90))}px`; if (c.color) b.style.background = c.color;
      const l = document.createElement("div"); l.className = "l"; l.textContent = c.label; l.setAttribute("data-layout-allow-overflow", ""); // axis label sits below the baseline by design
      w.appendChild(v); w.appendChild(b); w.appendChild(l); box.appendChild(w);
      return { v, b, c };
    });
    nodes.forEach(({ v, b, c }, i) => {
      const at = 0.9 + i * 0.22;
      tl.fromTo(b, { scaleY: 0 }, { scaleY: 1, duration: 1.1, ease: "power3.out" }, at);
      v.textContent = fmt(c.v); // final value from frame one — no roll-up (see stat tiles above)
      tl.fromTo(v, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 }, at);
    });
    tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
  } else {
    $("bars").style.display = "none";
    const S = DATA.line.series;
    const sec = (t) => t.split(":").map(Number).reduce((a, b) => a * 60 + b, 0) * (t.split(":").length === 2 ? 60 : 1);
    const ts = S.map((p) => sec(p.t)); const t0 = Math.min(...ts), t1 = Math.max(...ts);
    const vals = S.map((p) => p.v).concat((DATA.line.markers ?? []).map((m) => m.v));
    const vmax = DATA.line.yMax ?? Math.max(...vals) * 1.08, vmin = DATA.line.yMin ?? 0;
    const X = (t) => PADL + ((t - t0) / (t1 - t0)) * PW;
    const Y = (v) => PADT + PH * (1 - (v - vmin) / (vmax - vmin));
    const grid = $("grid"), axes = $("axes");
    const yTicks = DATA.line.yTicks ?? [0, vmax / 4, vmax / 2, (3 * vmax) / 4, vmax].map((v) => Math.round(v / 1000) * 1000);
    for (const v of yTicks) { const y = Y(v); el("line", { class: "grid", x1: PADL, x2: PADL + PW, y1: y, y2: y }, grid); const t = el("text", { class: "tick", x: PADL - 14, y: y + 7, "text-anchor": "end" }, axes); t.textContent = fmt(v); }
    const xTicks = DATA.line.xTicks ?? []; for (const tt of xTicks) { const x = X(sec(tt)); el("line", { class: "grid", x1: x, x2: x, y1: PADT, y2: PADT + PH }, grid); const t = el("text", { class: "tick", x, y: PADT + PH + 34, "text-anchor": "middle" }, axes); t.textContent = tt; }
    el("line", { class: "axis", x1: PADL, x2: PADL + PW, y1: PADT + PH, y2: PADT + PH }, axes);
    el("line", { class: "axis", x1: PADL, x2: PADL, y1: PADT, y2: PADT + PH }, axes);
    if (DATA.unit) { const t = el("text", { class: "tick", x: PADL - 14, y: PADT - 14, "text-anchor": "end" }, axes); t.textContent = DATA.unit.toUpperCase(); }
    const XY = S.map((p) => [X(sec(p.t)), Y(p.v)]);
    const d = XY.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join("");
    const series = $("series"); series.setAttribute("d", d);
    const len = series.getTotalLength(); series.setAttribute("stroke-dasharray", `${len} ${len}`); series.setAttribute("stroke-dashoffset", len);
    const area = $("area"); area.setAttribute("d", `${d}L${XY[XY.length - 1][0].toFixed(1)} ${(PADT + PH).toFixed(1)}L${XY[0][0].toFixed(1)} ${(PADT + PH).toFixed(1)}Z`);
    // points + labels (label above/below via p.labelPos)
    const ptNodes = S.map((p, i) => {
      const g = el("g", {}, $("pts")); const [x, y] = XY[i];
      el("circle", { class: "pt", cx: x, cy: y, r: 7 }, g);
      if (p.label) { const pos = p.labelPos ?? "above"; const dy = pos === "below" ? 30 : -18; const ta = p.labelAnchor ?? (i === S.length - 1 ? "end" : i === 0 ? "start" : "middle"); const t = el("text", { class: "ptlbl", x: x + (ta === "end" ? 6 : ta === "start" ? -4 : 0), y: y + dy, "text-anchor": ta }, g); t.textContent = p.label; }
      return g;
    });
    const mkNodes = (DATA.line.markers ?? []).map((m) => {
      const g = el("g", {}, $("mks")); const x = X(sec(m.t)), y = Y(m.v);
      el("line", { class: "head", x1: x, x2: x, y1: y, y2: PADT + PH, style: `stroke:${m.color ?? "var(--danger)"}` }, g);
      el("circle", { class: "mk", cx: x, cy: y, r: 8, style: `fill:${m.color ?? "var(--danger)"}` }, g);
      const t = el("text", { class: "mklbl", x: x + 14, y: y + 6, style: `fill:${m.color ?? "var(--danger)"}` }, g); t.textContent = m.label;
      return g;
    });
    // read head (chart-scrub-readout): ONE driver; text writes only when the nearest point changes
    const head = $("head"), headdot = $("headdot"), tip = $("tip"), tipT = $("tip-t"), tipV = $("tip-v"); $("tip-u").textContent = DATA.unit ?? "";
    head.setAttribute("y1", PADT); head.setAttribute("y2", PADT + PH);
    const drv = { p: 0 }; let lastIdx = "";
    const DRAW_AT = 1.0, DRAW = Math.max(3, DUR - DRAW_AT - 2.6);
    const place = () => {
      const tt = t0 + drv.p * (t1 - t0); let i = 0; while (i < S.length - 2 && ts[i + 1] <= tt) i++;
      const f = ts[i + 1] === ts[i] ? 0 : (tt - ts[i]) / (ts[i + 1] - ts[i]);
      const x = XY[i][0] + (XY[i + 1][0] - XY[i][0]) * f, y = XY[i][1] + (XY[i + 1][1] - XY[i][1]) * f;
      head.setAttribute("x1", x); head.setAttribute("x2", x); headdot.setAttribute("cx", x); headdot.setAttribute("cy", y);
      const v = S[i].v + (S[i + 1].v - S[i].v) * f;
      tipV.textContent = fmt(v);
      // the clock readout is the axis position (HH:MM), stepped per minute; at a data point it snaps to that point's exact stamp
      const near = Math.abs(tt - ts[i]) < 20 ? i : Math.abs(tt - ts[i + 1]) < 20 ? i + 1 : -1;
      const key = near >= 0 ? S[near].t : `${String(Math.floor(tt / 3600)).padStart(2, "0")}:${String(Math.floor((tt % 3600) / 60)).padStart(2, "0")}`;
      if (key !== lastIdx) { tipT.textContent = key; lastIdx = key; }
      series.setAttribute("stroke-dashoffset", len * (1 - drv.p));
      area.style.clipPath = `inset(0 ${Math.max(0, 100 - ((x - PADL) / PW) * 100)}% 0 0)`;
    };
    place();
    tl.fromTo([grid, axes], { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.5);
    tl.fromTo(tip, { opacity: 0 }, { opacity: 1, duration: 0.3 }, DRAW_AT);
    tl.fromTo([head, headdot], { opacity: 0 }, { opacity: 1, duration: 0.3 }, DRAW_AT);
    tl.to(drv, { p: 1, duration: DRAW, ease: "none", onUpdate: place }, DRAW_AT);
    ptNodes.forEach((g, i) => tl.fromTo(g, { opacity: 0, scale: 0.6, transformOrigin: `${XY[i][0]}px ${XY[i][1]}px` }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, DRAW_AT + ((ts[i] - t0) / (t1 - t0)) * DRAW));
    mkNodes.forEach((g, i) => { const m = DATA.line.markers[i]; tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.4 }, DRAW_AT + ((sec(m.t) - t0) / (t1 - t0)) * DRAW); });
  }
  tl.to([$("chrome"), $("plot"), $("stats"), $("note"), $("glow")], { opacity: 0, duration: 0.45, ease: "power2.in" }, DUR - 0.45);
  window.__timelines[ID] = tl;
})();
</script>
